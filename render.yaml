# Render 一键部署配置（免费套餐，内嵌 H2，无需外挂数据库）
# 用法：把 car-rental 目录推到 GitHub 后，Render 新建 Blueprint 选择该仓库即可
services:
  - type: web
    name: car-rental
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.html
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: free
