# 免费云平台演示配置：内嵌 H2（内存库），无需外挂 MySQL
# 启动：java -jar car-rental.jar --spring.profiles.active=free
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:car_rental;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/free-schema.sql
      data-locations: classpath:db/free-data.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cr: info
